# Railway Nixpacks Configuration for Laravel
# Configures PHP, Node.js, and build pipeline for deployment

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_sqlite", "php82Extensions.sqlite3", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.fileinfo", "php82Extensions.bcmath", "php82Extensions.tokenizer", "php82Extensions.ctype", "php82Extensions.dom", "php82Extensions.openssl", "nodejs_22"]

[phases.install]
cmds = [
    "mkdir -p /opt/app/storage/framework/{sessions,views,cache}",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci --ignore-scripts"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
