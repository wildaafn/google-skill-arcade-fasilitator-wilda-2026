# Railway Nixpacks Configuration for Laravel
# Configures PHP, Node.js, and build pipeline for deployment

[phases.setup]
nixPkgs = ["php83", "php83Extensions.pdo", "php83Extensions.pdo_sqlite", "php83Extensions.sqlite3", "php83Extensions.mbstring", "php83Extensions.xml", "php83Extensions.curl", "php83Extensions.fileinfo", "php83Extensions.bcmath", "php83Extensions.tokenizer", "php83Extensions.ctype", "php83Extensions.dom", "nodejs_22"]

[phases.install]
cmds = [
    "mkdir -p /opt/app/storage/framework/{sessions,views,cache}",
    "composer install --no-dev --optimize-autoloader --no-interaction",
    "npm ci --ignore-scripts"
]

[phases.build]
cmds = [
    "npm run build",
    "php artisan config:cache",
    "php artisan route:cache",
    "php artisan view:cache"
]

[start]
cmd = "php artisan migrate --force && php artisan db:seed --force && php artisan serve --host=0.0.0.0 --port=${PORT:-8080}"
